name: release

# core/package.json 의 version 숫자가 새로 올라간 채로 main에 올라오면,
# 자동으로 새 릴리스(업데이트 파일 + 처음 설치용 파일)를 만들어요.
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'app/**'
      - 'USAGE.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ELECTRON_VERSION: 33.2.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: 버전 확인
        id: ver
        run: |
          VER=$(node -p "require('./core/package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$VER 릴리스가 이미 있어서 건너뛰어요"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 업데이트용 파일(core.zip) 만들기
        if: steps.ver.outputs.exists == 'false'
        run: |
          cd core
          zip -q -r ../core.zip .

      - name: 처음 설치용 전체 파일 만들기
        if: steps.ver.outputs.exists == 'false'
        run: |
          F="electron-v${ELECTRON_VERSION}-win32-x64.zip"
          curl -fsSL -O "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/${F}"
          curl -fsSL -O "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/SHASUMS256.txt"
          grep " \*\?${F}\$" SHASUMS256.txt | sha256sum -c -
          mkdir ToDo-mini
          cd ToDo-mini
          unzip -q "../${F}"
          mv electron.exe ToDo-mini.exe
          # 아이콘/이름 심기 (실패해도 릴리스는 계속 진행)
          (cd .. && pip install -q pillow && python3 -c "from PIL import Image; Image.open('core/build/icon.png').convert('RGBA').save('icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])" \
            && mkdir -p /tmp/ri && cd /tmp/ri && npm init -y >/dev/null && npm i resedit@2 >/dev/null \
            && cd - >/dev/null && NODE_PATH=/tmp/ri/node_modules node tools/set-exe-icon.js ToDo-mini/ToDo-mini.exe icon.ico) || echo "아이콘 심기 건너뜀"
          mkdir -p resources/app
          cp ../app/main.js ../app/package.json resources/app/
          cp -r ../core resources/app/core
          cp ../USAGE.txt "사용법.txt"
          cd ..
          zip -q -r -9 ToDo-mini-win64.zip ToDo-mini

      - name: 릴리스 올리기
        if: steps.ver.outputs.exists == 'false'
        run: |
          VER="${{ steps.ver.outputs.version }}"
          gh release create "v$VER" core.zip ToDo-mini-win64.zip --target "$GITHUB_SHA" --title "v$VER" --generate-notes
