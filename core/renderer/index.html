<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>To-Do</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="style.css">
</head>
<body class="mode-desktop">
<div id="stage">
  <div id="card" class="card" data-hit>
    <div class="base"></div>
    <div class="haze"></div>
    <div class="in">
      <div id="hd" class="hd" data-whit title="두 번 클릭하면 편집 화면이 열리고 닫혀요"><h1>To-Do</h1>
        <div id="barwrap" class="dots">
      <button id="bSticker" class="card dot" type="button" data-hit title="스티커 꾸미기 (켜면 스티커를 끌어서 옮기고, 휠로 크기, 오른쪽 클릭으로 떼기)" aria-label="스티커 꾸미기"><span class="base"></span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg></button>
      <button id="bStkAdd" class="card dot" type="button" data-hit title="스티커 이미지 넣기" aria-label="스티커 이미지 넣기"><span class="base"></span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="bOpa" class="card dot" type="button" data-hit title="배경 투명도 (눌러서 조절, 휠로도 돼요)" aria-label="배경 투명도 (눌러서 조절, 휠로도 돼요)"><span class="base"></span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 3c3.5 4.2 6 7 6 10.2A6 6 0 0 1 6 13.2C6 10 8.5 7.2 12 3z"/></svg></button>
      <button id="bLock" class="card dot" type="button" data-hit title="위치 잠금" aria-label="위치 잠금"><span class="base"></span><svg id="lockIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path id="lockArc" d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
      <button id="bSet" class="card dot" type="button" data-hit title="설정" aria-label="설정"><span class="base"></span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/></svg></button>
      <div id="opaPop" class="card pop" data-hit><span class="base"></span><input id="opa" type="range" min="0" max="100" aria-label="배경 투명도"></div>
      </div>
      </div>
      <button id="upd" class="upd" type="button" data-whit></button>
      <div id="seg" class="seg"></div>
      <div id="list" class="list"></div>
      <div id="addrow" class="add">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <input id="newTodo" type="text" placeholder="새 할 일" maxlength="80" autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>

  <div id="stk"></div>
</div>
<script src="../theme.js"></script>
<script src="app.js"></script>
</body>
</html>
