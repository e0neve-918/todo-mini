<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>To-Do</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="style.css">
</head>
<body class="mode-desktop">
<div id="stage">
  <div id="card" class="card" data-hit>
    <div class="base"></div>
    <div class="haze"></div>
    <div class="in">
      <div id="hd" class="hd"><h1>To-Do</h1><span id="summary"></span></div>
      <button id="upd" class="upd" type="button"></button>
      <div id="seg" class="seg"></div>
      <div id="list" class="list"></div>
      <div id="addrow" class="add">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <input id="newTodo" type="text" placeholder="새 할 일" maxlength="80" autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>

  <div id="barwrap" class="card pill" data-hit>
    <div class="base"></div>
    <div class="haze"></div>
    <div class="bar">
      <button id="bSticker" class="ib" title="스티커 이미지 넣기" aria-label="스티커 이미지 넣기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg></button>
      <span class="vr"></span>
      <label class="sl" title="배경 투명도"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 3c3.5 4.2 6 7 6 10.2A6 6 0 0 1 6 13.2C6 10 8.5 7.2 12 3z"/></svg><input id="opa" type="range" min="0" max="100" aria-label="배경 투명도"></label>
      <span class="vr"></span>
      <button id="bPin" class="ib" title="항상 위에 표시" aria-label="항상 위에 표시"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v7"/></svg></button>
      <button id="bSet" class="ib" title="설정" aria-label="설정"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/></svg></button>
    </div>
  </div>

  <div id="stk"></div>
</div>
<script src="../theme.js"></script>
<script src="app.js"></script>
</body>
</html>
