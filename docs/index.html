<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ToDo-mini</title>
<meta name="description" content="바탕화면에 붙는 작은 To-Do 위젯 (Windows)">
<style>
:root{--bg1:#C9D1DC;--bg2:#AEBBCB;--ink:#1F2933;--sub:#33414F;--accent:#2F6FBF}
@media (prefers-color-scheme:dark){:root{--bg1:#252C36;--bg2:#161B22;--ink:#E8EDF3;--sub:#A9B6C4;--accent:#5B9BE6}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
 background:var(--bg1);background-image:linear-gradient(160deg,var(--bg1),var(--bg2));
 color:var(--ink);font-family:'Malgun Gothic','Segoe UI',system-ui,sans-serif}
.card{width:100%;max-width:420px;padding:32px 28px 24px;border-radius:24px;text-align:center;
 background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.2));
 border:1px solid rgba(255,255,255,.7);box-shadow:0 10px 28px rgba(30,45,70,.18)}
@media (prefers-color-scheme:dark){.card{background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border-color:rgba(255,255,255,.15)}}
h1{margin:0 0 6px;font-size:26px;font-weight:600}
p{margin:0 0 22px;font-size:14px;line-height:1.6;color:var(--sub)}
a.btn{display:block;padding:13px 16px;border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font-size:15px;font-weight:600}
a.btn:hover{filter:brightness(1.08)}
a.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
small{display:block;margin-top:14px;font-size:12px;line-height:1.6;color:var(--sub)}
</style>
</head>
<body>
<main class="card">
  <h1>ToDo-mini</h1>
  <p>바탕화면에 붙는 작은 To-Do 위젯.<br>체크리스트 · 스티커 · 투명 배경 · 글꼴 설정</p>
  <a class="btn" href="https://github.com/e0neve-918/todo-mini/releases/latest/download/ToDo-mini-win64.zip">Windows용 다운로드</a>
  <small>압축을 풀고 ToDo-mini.exe를 실행하세요.<br>파란 경고창이 뜨면 [추가 정보] → [실행]을 눌러 주세요.<br>한 번 설치하면 이후 업데이트는 앱 안에서 알려드려요.</small>
</main>
</body>
</html>
